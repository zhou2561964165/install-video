          description: 0为手动；非零15..300秒，隐藏页面暂停，不自动重发写操作。
      description: 服务端配置的运行值；reason_min<=reason_max；刷新0或15..300，隐藏页暂停；幂等结果至少7天默认30天，之后保留不可复用key墓碑。安全约束不可由前端放宽。
    PaginationPolicy:
      type: object
      additionalProperties: true
      required:
      - default_page
      - default_page_size
      - max_page_size
      properties:
        default_page:
          type: integer
          minimum: 1
          const: 1
        default_page_size:
          type: integer
          minimum: 1
          maximum: 1000
          default: 20
        max_page_size:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
      description: default_page_size<=max_page_size，所有列表运行最大值由此投影。协议上限1000，超运行值422；前端不能自行放宽。
    StateDisplay:
      type: object
      additionalProperties: true
      required:
      - value
      - label
      - tone
      properties:
        value:
          type: string
        label:
          type: string
        tone:
          type: string
          enum:
          - neutral
          - info
          - success
          - warning
          - error
      description: 只为显示提供安全标签；客户端只接受预定义tone，不执行返回内容。未知value中性回退。
    StateDictionary:
      type: object
      additionalProperties: true
      required:
      - domain
      - values
      properties:
        domain:
          type: string
        values:
          type: array
          items:
            $ref: '#/components/schemas/StateDisplay'
      description: 仅预定义领域键，如job.public_status、job.internal_state、membership.status、checkout.state。开放value用于兼容状态扩展，不改业务状态语义。
    FilterDescriptor:
      type: object
      additionalProperties: true
      required:
      - name
      - kind
      properties:
        name:
          type: string
        allowed_values:
          type: array
          items:
            type: string
          description: 仅kind=enum时必须提供，客户端取契约枚举与此值交集；其他kind不提供，禁止列真实账号/ID白名单。
        kind:
          type: string
          enum:
          - enum
          - boolean
          - text
          - id
          - datetime
      description: name必须是该resource契约已支持的查询参数；enum按allowed_values交集，boolean/text/id/datetime按契约schema校验，无有限值白名单。不得生成任意SQL。
      allOf:
      - if:
          properties:
            kind:
              const: enum
          required:
          - kind
        then:
          required:
          - allowed_values
        else:
          not:
            required:
            - allowed_values
    ResourceQuery:
      type: object
      additionalProperties: true
      required:
      - resource
      - sort_values
      - filters
      properties:
        resource:
          type: string
        sort_values:
          type: array
          items:
            type: string
        filters:
          type: array
          items:
            $ref: '#/components/schemas/FilterDescriptor'
      description: resource为受支持列表operationId；sort_values取契约与服务器交集，filters为安全参数白名单，不含分页/sort。未知name/kind不自动渲染，服务端校验失败422。
    AdminMeta:
      type: object
      additionalProperties: true
      required:
      - api_version
      - contract_version
      - as_of
      - features
      - pagination
      - display_timezone
      - quota_day_timezone
      - quota_day_semantics
      - limits
      - queries
      - state_dictionaries
      properties:
        api_version:
          type: string
          description: 当前主版本，例如v1；破坏性变更走v2。
        contract_version:
          type: string
          description: 对应冻结契约修订版本。
        as_of:
          $ref: '#/components/schemas/UtcTime'
          description: 请求只读事务DB时钟的UTC ISO8601时间，非空且以Z结尾。
        features:
          $ref: '#/components/schemas/Capabilities'
        pagination:
          $ref: '#/components/schemas/PaginationPolicy'
        display_timezone:
          type: string
          description: 服务端安全配置的IANA显示时区；存储/接口仍UTC，不影响quota_day。
        quota_day_timezone:
          type: string
          const: UTC
        quota_day_semantics:
          type: string
          const: accepted_at_utc_date
          description: PG受理扣额以DownloadOperation.accepted_at的UTC日期冻结，重放不移日；用户今日额度投影取请求事务DB时钟as_of的UTC日期。
        limits:
          $ref: '#/components/schemas/PolicyLimits'
        queries:
          type: array
          items:
            $ref: '#/components/schemas/ResourceQuery'
        state_dictionaries:
          type: array
          items:
            $ref: '#/components/schemas/StateDictionary'
      description: 所有有效管理会话可读，不额外要求业务权限。基础只读菜单/GET按permission；仅启停和金额列额外按features。只返回安全显示元数据，不返回密钥、账号/ID白名单或动态规则。 example完全合成、不是运行配置或验收证据；实际queries列出所有受支持resource/filters/sorts。
      example:
        api_version: v1
        contract_version: 1.0.0-proposal.20261026.2
        as_of: '2026-10-26T00:00:00Z'
        features:
          account_access_write:
            ready: false
            reason: M2尚未实施
          billing_amounts:
            ready: false
            reason: 金额投影尚未验收
        pagination:
          default_page: 1
          default_page_size: 20
          max_page_size: 100
        display_timezone: Asia/Singapore
        quota_day_timezone: UTC
        quota_day_semantics: accepted_at_utc_date
        limits:
          session_ttl_seconds: 900
          reason_min_length: 10
          reason_max_length: 500
          idempotency_replay_retention_seconds: 2592000
          refresh_interval_seconds: 0
        queries:
        - resource: adminListUsers
          sort_values:
          - created_at:desc
          - email:asc
          filters:
          - name: email
            kind: text
          - name: enabled
            kind: boolean
        - resource: adminListJobs
          sort_values:
          - created_at:desc
          filters:
          - name: user_id
            kind: id
          - name: public_status
            kind: enum
            allowed_values:
            - queued
            - downloading
            - merging
            - done
            - error
          - name: internal_state
            kind: enum
            allowed_values:
            - queued
            - running
            - retry_wait
            - succeeded
            - failed
            - needs_review
            - legacy_hold
            - legacy_unset
        - resource: adminListCheckouts
          sort_values:
          - created_at:desc
          filters:
          - name: state
            kind: enum
            allowed_values:
            - pending
            - open
            - paid
            - expired
            - failed
        - resource: adminListAuditLogs
          sort_values:
          - recorded_at:desc
          filters:
          - name: recorded_from
            kind: datetime
        state_dictionaries:
        - domain: job.public_status
          values:
          - value: done
            label: 已完成
            tone: success
