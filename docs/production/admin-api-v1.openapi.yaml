        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - created_at:asc
          - created_at:desc
          - updated_at:asc
          - updated_at:desc
          default: created_at:desc
        description: 受控字段方向枚举，追加实体主键ASC稳定排序、NULLS LAST；Membership主键user_id、Payment主键payment_intent映射id。
      - name: user_id
        in: query
        required: false
        description: ''
        schema:
          $ref: '#/components/schemas/Id'
      - name: public_status
        in: query
        required: false
        schema:
          type: string
          enum:
          - queued
          - downloading
          - merging
          - done
          - error
      - name: internal_state
        in: query
        required: false
        description: legacy_unset仅为查询伪值，匹配Job.internal_state IS NULL；response仍为null，不新增或写回业务状态。枚举与meta允许值取交集。
        schema:
          type: string
          enum:
          - queued
          - running
          - retry_wait
          - succeeded
          - failed
          - needs_review
          - legacy_hold
          - legacy_unset
      - name: execution_version
        in: query
        required: false
        description: ''
        schema:
          type: integer
          enum:
          - 1
          - 2
      x-permission: jobs:read
      summary: 当前保留server Job列表
      description: 只读安全投影；每请求强鉴权，permission在服务端执行；基础只读不依赖可选feature，不调用第三方、不修复数据。 基础只读按x-permission授权，billing_amounts不影响支付记录页面；只有金额列另查该feature。
