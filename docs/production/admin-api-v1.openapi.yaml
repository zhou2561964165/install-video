openapi: 3.1.0
info:
  title: Install Video Admin API
  version: 1.0.0-proposal.20261028.3
  description: 独立前端工作树中的契约对齐候选，尚未联调验收，不要求Claude接收或修改代码；共享正式文档保持原修订。配套 admin-integration-plan-2026-10-26.md；M1管理认证与只读，M2账号启停；.3 仅新增客服工单与审核后补发（Claude 维护，2026-10-28）。默认值可配置，服务端安全边界与版本契约集中维护。候选约定所有管理响应含X-Request-ID，错误体request_id与其一致；外层限流429也遵循本错误形状。
servers:
- url: /api/admin/v1
  description: 规范API前缀；外层部署前缀由ADMIN_API_BASE提供。
security:
- AdminCookie: []
tags:
- name: Auth
- name: Overview
- name: Users
- name: Jobs
- name: Memberships
- name: Billing
- name: Audit
- name: System
- name: Support
paths:
  /auth/login:
    post:
      operationId: adminLogin
      tags:
      - Auth
      x-phase: M1
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionCreated'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Set-Cookie:
              schema:
                type: string
              description: iv_admin_session=<opaque>; HttpOnly; Secure; SameSite=Strict; Path=<显式ADMIN_COOKIE_PATH>; Max-Age=<配置TTL>。Path不从请求推断，配置缺失503；默认TTL900秒，明确dev
                HTTP可Secure=false。
          description: 成功安全投影。
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      summary: 管理员登录
      description: JSON邮箱/密码校验现有密码及AdminGrant/AccountControl；不存在用户也校验固定哑哈希，统一401。ADMIN_ALLOWED_ORIGINS为空拒绝写方法；限流429含约定JSON及X-Request-ID，包括外层中间件。替换当前浏览器旧管理会话，不接受普通Bearer。
  /auth/me:
    get:
      operationId: adminMe
      tags:
      - Auth
      x-phase: M1
      responses:
        '200':
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminMe'
          description: 成功安全投影。
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
      summary: 当前会话与开放权限集合
      description: 实时校验session/AccountControl/AdminGrant，返回开放permission字符串。CSRF确定派生，GET不旋转，禁止日志。
  /auth/logout:
    post:
      operationId: adminLogout
      tags:
      - Auth
      x-phase: M1
      responses:
        '204':
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Set-Cookie:
              schema:
                type: string
              description: 同名、相同部署Path cookie Max-Age=0；服务端同时撤销。
          description: 会话已撤销并清相同Path的cookie，无响应体。
        '401':
          description: 会话过期或已撤销；返回统一错误并清同名、相同ADMIN_COOKIE_PATH的cookie，不修改其他状态。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Set-Cookie:
              schema:
                type: string
              description: iv_admin_session=; Max-Age=0；Path与显式ADMIN_COOKIE_PATH相同，保留HttpOnly/Secure/SameSite属性。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - $ref: '#/components/parameters/Csrf'
      summary: 撤销当前管理会话
      description: 校验实时会话、Origin和X-CSRF-Token后服务器撤销并清cookie；重复使用已撤销或过期会话401也用相同ADMIN_COOKIE_PATH清cookie。客户端遇到任何401清内存会话、permissions、meta与CSRF并转登录。
  /overview:
    get:
      operationId: adminOverview
      tags:
      - Overview
      x-phase: M1
      responses:
        '200':
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Overview'
          description: 成功安全投影。
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-permission: overview:read
      summary: 有明确统计口径的真实概览
      description: 只读安全投影；每请求强鉴权，permission在服务端执行；基础只读不依赖可选feature，不调用第三方、不修复数据。 基础只读按x-permission授权，billing_amounts不影响支付记录页面；只有金额列另查该feature。
  /users:
    get:
      operationId: adminListUsers
      tags:
      - Users
      x-phase: M1
      responses:
        '200':
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
          description: 成功安全投影。
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - created_at:asc
          - created_at:desc
          - email:asc
          - email:desc
          default: created_at:desc
        description: 受控字段方向枚举，追加实体主键ASC稳定排序、NULLS LAST；Membership主键user_id、Payment主键payment_intent映射id。
      - name: email
        in: query
        required: false
        schema:
          type: string
          maxLength: 254
      - name: enabled
        in: query
        required: false
        description: ''
        schema:
          type: boolean
      - name: effective_vip
        in: query
        required: false
        description: ''
        schema:
          type: boolean
      x-permission: users:read
      summary: 用户与权益列表
      description: 只读安全投影；每请求强鉴权，permission在服务端执行；基础只读不依赖可选feature，不调用第三方、不修复数据。 基础只读按x-permission授权，billing_amounts不影响支付记录页面；只有金额列另查该feature。
  /users/{user_id}:
    get:
      operationId: adminGetUser
      tags:
      - Users
      x-phase: M1
      responses:
        '200':
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetail'
          description: 成功安全投影。
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
        description: 不透明路径ID；不存在404。
      x-permission: users:read
      summary: 用户、会员与UTC当日额度
      description: 只读安全投影；每请求强鉴权，permission在服务端执行；基础只读不依赖可选feature，不调用第三方、不修复数据。 基础只读按x-permission授权，billing_amounts不影响支付记录页面；只有金额列另查该feature。
  /users/{user_id}/access:
    patch:
      operationId: adminSetUserAccess
      tags:
      - Users
      x-phase: M2
      responses:
        '200':
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessResult'
          description: 成功安全投影。
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
        description: 不透明路径ID；不存在404。
      - $ref: '#/components/parameters/Csrf'
      - $ref: '#/components/parameters/IdempotencyKey'
      x-permission: users:access:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessPatch'
      summary: 账号启停（M2）
      description: M1 feature未就绪返回503。M2同事务按稳定user_id顺序锁操作者/目标控制行及所需授权行，实时复核权限和自身/有效AdminGrant保护后才查幂等。CLI授撤目标管理员也先锁同目标控制行。保留期同actor/key/body重放在revision比较前返回原结果，异输入/结果过期409且墓碑阻止执行；新请求比expected_revision。真实enabled变更才增revision/auth_revision并撤销会话、同事务审计；no-op只审计。普通JWT新ar与实时控制检查先上线，无ar旧token拒绝，恢复后旧token不复活；未知结果禁止自动重发新key。
        幂等固定operation=users.access，唯一(actor_user_id,operation,key)，请求指纹含规范化method/path/target_user_id/body；audit.action是结果，不参与scope。
        指纹body只含规范化enabled、trim后reason、expected_revision；method/path/target同样参与，跨target重用同key为409，不是新操作。审计action区分users.access_enabled/disabled/noop/denied。
  /jobs:
    get:
      operationId: adminListJobs
      tags:
      - Jobs
      x-phase: M1
      responses:
        '200':
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
