      - $ref: '#/components/parameters/IdempotencyKey'
      x-permission: support:reissue
      x-capability: support_reissue
      summary: 审核通过并补发会员
      description: 同一事务行锁内复核：工单open且类型匹配、订单属于该用户且未履行、新鲜期内verified核实、付款未绑定他人或撤销、该订单未补发过。失败409（ticket_closed/not_reissuable_category/checkout_mismatch/already_fulfilled/not_verified/verification_stale/payment_conflict/membership_active/subscription_active/already_reissued）；会员仍由另一笔付款生效或绑定订阅时拒绝叠加补发。同key同工单重放返回原结果。
components:
  securitySchemes:
    AdminCookie:
      type: apiKey
      in: cookie
      name: iv_admin_session
      description: 独立opaque服务端会话，TTL默认900秒、配置范围300..3600秒，绝对期限不滑动。生产HttpOnly/Secure/SameSite=Strict、Path为显式ADMIN_COOKIE_PATH，不从请求推断；缺失配置503。每请求实时检查授权与账号。
  parameters:
    Page:
      name: page
      in: query
      required: false
      description: 页码，默认1。
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      required: false
      description: 默认20、运行上限默认100，以meta为准；协议硬上限1000，超运行上限422。
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 20
    Csrf:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 32
      description: 已认证写操作必须带由独立ADMIN_CSRF_SECRET确定派生的会话CSRF token，同时验证ADMIN_ALLOWED_ORIGINS；Origin配置为空拒绝写，secret缺失或过短后台整体503 admin_unavailable。
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: ^[A-Za-z0-9._:-]+$
      description: actor_user_id+固定operation=users.access作用域；16..128 ASCII字符。指纹含规范化method/path/target_user_id/body；与审计结果action独立。默认保留结果30天至少7天，之后墓碑不可复用，不自动更换。
        跨target复用key冲突，body规范化enabled/reason/expected_revision。
  headers:
    RequestId:
      description: Backend generated request UUID; identical to error detail.request_id and audit request_id.
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: 401：未认证、过期或撤销；login统一失败。客户端清内存会话、permissions、meta与CSRF后转登录；logout额外清同Path cookie。
    Forbidden:
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: 403：权限/Origin/CSRF不符或protected_account。
    NotFound:
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: 404：资源不存在。
    Conflict:
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: 409：revision_changed、idempotency_conflict或idempotency_result_expired；不重复执行。
    ValidationError:
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: 422：输入/过滤器/运行限制不合法，安全field_errors。
    TooManyRequests:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          schema:
            type: integer
            minimum: 1
          description: 可选等待秒数；不是自动重发写请求的许可。
      description: 429：限流；按Retry-After等待，不自动重发写操作。包括在admin子应用之前生效的全局中间件，也须返回本JSON错误形状与X-Request-ID。
    Unavailable:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          schema:
            type: integer
            minimum: 1
          description: 可选等待秒数；不是自动重发写请求的许可。
      description: 503：服务/能力未就绪，写结果可能未知，不自动更换key。
  schemas:
    Id:
      type: string
      minLength: 1
      maxLength: 256
      pattern: ^[A-Za-z0-9_.:-]+$
      description: 不透明非空ID，字符串传输；禁止写死实际用户ID、邮箱或供应商对象ID。
    Decimal:
      type: string
      pattern: ^(0|[1-9][0-9]*)$
    UtcTime:
      type: string
      format: date-time
      pattern: Z$
    NullableUtcTime:
      type:
      - string
      - 'null'
      format: date-time
      pattern: Z$
    Error:
      type: object
      additionalProperties: true
      required:
      - detail
      properties:
        detail:
          type: object
          additionalProperties: true
          required:
          - error_type
          - error
          - request_id
          properties:
            error_type:
              type: string
            error:
              type: string
            request_id:
              type: string
            field_errors:
              type: array
              items:
                type: object
                additionalProperties: true
                required:
                - field
                - message
                properties:
                  field:
                    type: string
                  message:
                    type: string
          description: 安全投影字段 detail；精确语义见所属DTO说明。
      description: admin独立异常形状，不改变普通API。detail含安全error_type/error/request_id，request_id为后台生成并与X-Request-ID响应头一致，审计记录沿用；422可有field_errors。不泄露堆栈或原始供应商响应，外层429也适配此形状。
    Permission:
      type: string
      minLength: 1
      description: 开放权限字符串集合；前端按已支持permission key判断，未知值不自动授权；服务端deny by default。
      x-known-values:
      - overview:read
      - users:read
      - memberships:read
      - jobs:read
      - billing:read
      - audit:read
      - system:read
      - users:access:write
      - support:read
      - support:write
      - support:reissue
    Capability:
      type: object
      additionalProperties: true
      required:
      - ready
      - reason
      properties:
        ready:
          type: boolean
          description: 安全投影字段 ready；精确语义见所属DTO说明。
        reason:
          type:
          - string
          - 'null'
          description: 安全投影字段 reason；精确语义见所属DTO说明。
    Capabilities:
      type: object
      additionalProperties: true
      required:
      - account_access_write
      - billing_amounts
      - support_reissue
      properties:
        account_access_write:
          $ref: '#/components/schemas/Capability'
        billing_amounts:
          $ref: '#/components/schemas/Capability'
        support_reissue:
          $ref: '#/components/schemas/Capability'
      description: 仅可选能力key：account_access_write控制M2启停，billing_amounts控制金额列，不控制billing页面。基础只读菜单/GET只按各自permission；未知可选能力默认关闭。M1两能力ready=false。
    SessionCreated:
      type: object
      additionalProperties: true
