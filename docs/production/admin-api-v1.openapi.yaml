x-global-conventions:
- UI使用ui-ux-pro-max/design-system与三层tokens，窄接口、单向依赖。
- 只有ytdlp_service接触yt-dlp；GET不调用供应商、不修复数据。
- response开放新增可选字段；客户端pick支持字段，未知状态中性显示；request对象封闭，enum过滤器取契约与meta允许值交集，自由输入按name/kind/schema。
- 角色为可扩展标识，权限集合开放字符串；前端不按role判断，服务端deny-by-default。
- 默认值服务端集中配置，前端按meta；安全边界与v1wire不任意放宽，破坏改动v2。
