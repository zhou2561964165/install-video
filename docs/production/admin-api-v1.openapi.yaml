      x-permission: memberships:read
      summary: 持久会员行列表
      description: 只列实际Membership行，effective由现有domain计算；用户详情无行另外投影free，不写行；主键user_id稳定排序。 基础只读按x-permission授权，billing_amounts不影响支付记录页面；只有金额列另查该feature。
